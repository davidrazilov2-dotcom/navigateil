<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#33ccff">
<title>נוסעים – ניווט חי בישראל</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#33ccff;--blue-d:#0aa5dd;--ink:#1d2733;--mut:#6b7784;--line:#e4e9ee;--nav:#16222f}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;font:16px/1.45 Rubik,system-ui,sans-serif;color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent}
#rot{position:fixed;left:0;top:0;width:100vw;height:100vh;transform-origin:50% 50%;z-index:0;will-change:transform}
#map{position:absolute;inset:0;background:#eef0ec}
.attr{position:fixed;bottom:2px;left:6px;z-index:400;font-size:11px;color:#556;background:rgba(255,255,255,.7);padding:0 5px;border-radius:4px}
.attr a{color:inherit}
.card{background:#fff;border-radius:18px;box-shadow:0 6px 24px rgba(20,40,60,.18)}
/* ---- חיפוש ---- */
.top{position:fixed;top:max(12px,env(safe-area-inset-top));inset-inline:12px;z-index:500;max-width:460px;margin-inline-start:auto}
.search{padding:10px 12px;display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;position:relative}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.a{background:#fff;border:3px solid var(--blue-d)}.dot.b{background:#ff4f6d}
.row input{flex:1;font:inherit;font-size:16px;border:0;background:#f2f5f8;border-radius:12px;padding:11px 12px;outline:none;color:var(--ink)}
.row input:focus{background:#e8f6fd;box-shadow:inset 0 0 0 2px var(--blue)}
.ibtn{width:44px;height:44px;border:0;border-radius:12px;background:#f2f5f8;cursor:pointer;display:grid;place-items:center;flex:none;color:var(--ink)}
.ibtn svg{width:20px;height:20px}
.sugg{position:absolute;top:100%;inset-inline:22px 0;z-index:10;margin-top:4px;padding:4px;display:none;max-height:50vh;overflow:auto}
.sugg button{display:block;width:100%;text-align:start;border:0;background:none;padding:10px;border-radius:10px;font:inherit;cursor:pointer;color:var(--ink)}
.sugg button:hover{background:#eef7fc}
.sugg small{display:block;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.go{margin:0 12px 12px}
.cta{width:100%;height:50px;border:0;border-radius:25px;background:var(--blue);color:#fff;font:700 18px Rubik,sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--blue-d)}
.cta:active{transform:translateY(2px);box-shadow:none}
.cta:disabled{background:#b9d9e6;box-shadow:none}
.note{font-size:13px;color:var(--mut);padding:0 14px 10px}
/* ---- תצוגה מקדימה ---- */
.sheet{position:fixed;bottom:0;inset-inline:0;z-index:500;max-width:460px;margin-inline-start:auto;display:none;will-change:transform}
.sheet .card{padding:0 16px max(14px,env(safe-area-inset-bottom));max-height:75vh;display:flex;flex-direction:column;border-radius:22px 22px 0 0}
.grab{touch-action:none;cursor:grab;padding-top:8px;user-select:none;-webkit-user-select:none}
.handle{display:block;width:44px;height:5px;border-radius:3px;background:#cfd6dd;margin:0 auto 10px}
.eta{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.eta b{font-size:32px;line-height:1.05;color:var(--blue-d)}
.eta span{color:var(--mut)}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{height:48px;border-radius:24px;border:1px solid var(--line);background:#fff;font:500 16px Rubik,sans-serif;cursor:pointer;color:var(--ink);padding:0 14px}
.btns .start{flex:1;background:var(--blue);border:0;color:#fff;font-weight:700;font-size:18px;box-shadow:0 3px 0 var(--blue-d)}
.steps{list-style:none;margin:12px 0 0;padding:0;overflow:auto;border-top:1px solid var(--line)}
.steps li{display:flex;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:center}
.ic{width:34px;height:34px;border-radius:50%;background:#eaf7fd;display:grid;place-items:center;flex:none;font-size:20px;color:var(--blue-d);font-weight:700}
.steps .d{margin-inline-start:auto;color:var(--mut);font-size:14px;white-space:nowrap}
/* ---- מצב נסיעה ---- */
.nav-only{display:none}#simTag[hidden]{display:none!important}
body.nav .nav-only{display:block}
body.nav .top,body.nav .sheet,body.nav #locate{display:none!important}
#banner{position:fixed;top:0;inset-inline:0;z-index:600;background:var(--nav);color:#fff;padding:max(12px,env(safe-area-inset-top)) 16px 14px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#banner .in{display:flex;align-items:center;gap:14px;max-width:640px;margin:0 auto}
#bArrow{width:64px;height:64px;border-radius:16px;background:var(--blue);display:grid;place-items:center;font-size:42px;font-weight:800;flex:none;line-height:1}
#bDist{font-size:34px;font-weight:800;line-height:1.05;white-space:nowrap}
#bText{font-size:18px;opacity:.92;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#navbar{position:fixed;bottom:0;inset-inline:0;z-index:600;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.18);padding:0 16px max(14px,env(safe-area-inset-bottom));max-height:70vh;display:none;flex-direction:column;will-change:transform}
body.nav #navbar{display:flex}
#navbar .grab{padding-bottom:10px}
#navSteps{max-width:640px;width:100%;margin:0 auto}
#navbar .in{display:flex;align-items:center;gap:12px;max-width:640px;margin:0 auto}
#nEta{font-size:28px;font-weight:800;line-height:1}
#nRem{color:var(--mut);font-size:15px;margin-top:4px;white-space:nowrap}
.stop{margin-inline-start:auto;height:50px;padding:0 22px;border:0;border-radius:25px;background:#ff4f6d;color:#fff;font:700 17px Rubik,sans-serif;cursor:pointer}
.round{width:50px;height:50px;border-radius:50%;border:0;background:#f2f5f8;cursor:pointer;display:grid;place-items:center;flex:none;font-size:22px}
#speed{position:fixed;z-index:600;left:14px;bottom:calc(var(--navpeek,110px) + 14px);width:74px;height:74px;border-radius:50%;background:#fff;box-shadow:0 4px 16px rgba(0,0,0,.25);text-align:center;padding-top:12px}
#speed b{display:block;font-size:28px;font-weight:800;line-height:1}
#speed small{font-size:12px;color:var(--mut)}
#simTag{position:fixed;z-index:600;right:14px;bottom:calc(var(--navpeek,110px) + 14px);background:#ffcc00;color:#222;font-weight:700;font-size:13px;padding:6px 12px;border-radius:14px}
#recenter{position:fixed;z-index:620;left:50%;transform:translateX(-50%);bottom:calc(var(--navpeek,110px) + 16px);height:48px;padding:0 22px;border:0;border-radius:24px;background:var(--nav);color:#fff;font:700 16px Rubik,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;display:none;white-space:nowrap}
body.nav.free #recenter{display:block}
#zoomBtns{position:fixed;z-index:620;right:12px;top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:10px}
body.nav #zoomBtns{display:flex}
#zoomBtns button{width:56px;height:56px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.28);font:700 30px/1 Rubik,sans-serif;color:var(--ink);cursor:pointer;touch-action:manipulation}
#zoomBtns button:active{background:#e8f6fd}
html,body{touch-action:manipulation;overscroll-behavior:none}
#reroute{position:fixed;z-index:650;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--nav);color:#fff;padding:14px 22px;border-radius:16px;font-weight:700;display:none}
.fab{position:fixed;z-index:500;inset-inline-start:12px;bottom:max(18px,env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:0;background:#fff;box-shadow:0 4px 16px rgba(20,40,60,.25);cursor:pointer;display:grid;place-items:center;color:var(--blue-d)}
.fab svg{width:24px;height:24px}
body.has-route .fab{bottom:calc(var(--peek,200px) + 14px)}
.toast{position:fixed;z-index:900;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;display:none;max-width:86vw;text-align:center}
.me{width:20px;height:20px;border-radius:50%;background:var(--blue-d);border:4px solid #fff;box-shadow:0 0 0 8px rgba(51,204,255,.25)}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.car{width:56px;height:56px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media(max-width:600px){.top,.sheet{max-width:none}#bDist{font-size:30px}#bArrow{width:58px;height:58px;font-size:38px}}
</style>
</head>
<body>
<div id="rot"><div id="map"></div></div>
<div class="attr">© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · מסלולים: OSRM</div>

<div class="top">
  <div class="card">
    <form class="search" id="f" autocomplete="off">
      <div class="row">
        <i class="dot a"></i>
        <input id="from" placeholder="מאיפה? (המיקום שלי)" aria-label="נקודת מוצא">
        <button type="button" class="ibtn" id="swap" aria-label="החלף מוצא ויעד"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
        <div class="sugg card" id="s-from"></div>
      </div>
      <div class="row">
        <i class="dot b"></i>
        <input id="to" placeholder="לאן נוסעים?" aria-label="יעד">
        <button type="button" class="ibtn" id="clear" aria-label="נקה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <div class="sugg card" id="s-to"></div>
      </div>
    </form>
    <div class="go"><button class="cta" id="goBtn" disabled>חשב מסלול</button></div>
    <div class="note">מסלול ישיר בלי עצירות. אפשר גם ללחוץ על המפה כדי לבחור יעד.</div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="card">
    <div class="grab"><i class="handle"></i><div class="eta"><b id="dur"></b><span id="dist"></span><span id="arr"></span></div></div>
    <div class="btns" id="peekEnd">
      <button class="start" id="startNav">יוצאים לדרך!</button>
      <button id="simNav">הדמיה</button>
      <button id="cancel">ביטול</button>
    </div>
    <ul class="steps" id="steps"></ul>
  </div>
</div>

<div id="banner" class="nav-only"><div class="in">
  <div id="bArrow">↑</div>
  <div><div id="bDist"></div><div id="bText"></div></div>
</div></div>
<div id="navbar"><div class="grab"><i class="handle"></i><div class="in" id="navPeek">
  <div><div id="nEta"></div><div id="nRem"></div></div>
  <button class="round" id="mute" aria-label="השתק קול">🔊</button>
  <button class="stop" id="stopNav">עצור</button>
</div></div>
<ul class="steps" id="navSteps"></ul></div>
<div id="speed" class="nav-only"><b id="spd">0</b><small>קמ"ש</small></div>
<div id="simTag" class="nav-only" hidden>מצב הדמיה</div>
<button id="recenter">➤ חזרה לנסיעה</button>
<div id="zoomBtns"><button id="zin" aria-label="הגדל">+</button><button id="zout" aria-label="הקטן">−</button></div>
<div id="reroute">מחשב מסלול מחדש…</div>

<button class="fab" id="locate" aria-label="המיקום שלי"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RAD=Math.PI/180;

const map=L.map('map',{zoomControl:false,zoomSnap:0.25,attributionControl:false,maxBounds:[[28.5,33.2],[34.2,36.8]],minZoom:7}).fitBounds([[29.4,34.2],[33.4,35.95]]);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);

const S={from:null,to:null,me:null};
let meMarker,fromMarker,toMarker,routeLine,routeCasing,carMarker,R=null;

function toast(t,ms=2600){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)}
const pinIcon=c=>L.divIcon({className:'',html:`<div class="pin" style="background:${c}"></div>`,iconSize:[26,26],iconAnchor:[13,30]});
const meIcon=L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[20,20],iconAnchor:[10,10]});
const carIcon=L.divIcon({className:'',iconSize:[56,56],iconAnchor:[28,28],html:
 '<svg class="car" id="carSvg" viewBox="0 0 56 56"><circle cx="28" cy="28" r="25" fill="#fff"/><circle cx="28" cy="28" r="21" fill="#33ccff"/><path d="M28 11 41 40 28 33 15 40Z" fill="#fff" stroke="#0a7fb0" stroke-width="2" stroke-linejoin="round"/></svg>'});

/* ===== חיפוש ===== */
async function geocode(q){
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&countrycodes=il&accept-language=he&q='+encodeURIComponent(q));
  if(!r.ok)throw 0;return r.json();
}
async function reverse(lat,lon){
  const fb='נקודה במפה ('+lat.toFixed(5)+', '+lon.toFixed(5)+')';
  try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=he&zoom=18&lat=${lat}&lon=${lon}`);const j=await r.json();
    if(!j||j.error)return fb;
    const a=j.address||{},city=a.city||a.town||a.village||a.suburb||'';
    const t=[[a.road,a.house_number].filter(Boolean).join(' '),city].filter(Boolean).join(', ');
    return t||(j.display_name?j.display_name.split(',').slice(0,2).join(','):fb)}catch{return fb}
}
function setupSearch(key){
  const inp=$(key),box=$('s-'+key);let t;
  inp.addEventListener('input',()=>{
    S[key]=null;updateGo();clearTimeout(t);
    const q=inp.value.trim();if(q.length<2){box.style.display='none';return}
    t=setTimeout(async()=>{
      try{
        const res=await geocode(q);
        if(!res.length){box.innerHTML='<button type="button" disabled>לא נמצאו תוצאות</button>';box.style.display='block';return}
        box.innerHTML=res.map((p,i)=>{const s=p.display_name.split(',');return `<button type="button" data-i="${i}">${esc(s[0])}<small>${esc(s.slice(1,4).join(','))}</small></button>`}).join('');
        box.style.display='block';
        box.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{
          const p=res[+b.dataset.i];inp.value=p.display_name.split(',').slice(0,2).join(',');
          box.style.display='none';setPoint(key,[+p.lat,+p.lon]);
        });
      }catch{toast('שגיאה בחיפוש, נסה שוב')}
    },550);
  });
  inp.addEventListener('blur',()=>setTimeout(()=>box.style.display='none',200));
}
setupSearch('from');setupSearch('to');

function setPoint(key,ll,fly=true){
  S[key]=ll;
  if(key==='from'){fromMarker&&map.removeLayer(fromMarker);fromMarker=ll&&L.marker(ll,{icon:pinIcon('#0aa5dd')}).addTo(map)}
  else{toMarker&&map.removeLayer(toMarker);toMarker=ll&&L.marker(ll,{icon:pinIcon('#ff4f6d')}).addTo(map)}
  if(fly&&ll)map.flyTo(ll,Math.max(map.getZoom(),14),{duration:.8});
  updateGo();
}
function updateGo(){$('goBtn').disabled=!(S.to&&(S.from||S.me))}

map.on('click',async e=>{
  if(document.body.classList.contains('nav'))return;
  const ll=[e.latlng.lat,e.latlng.lng];setPoint('to',ll,false);
  $('to').value='טוען כתובת…';$('to').value=await reverse(ll[0],ll[1]);
});

function locate(cb){
  if(!navigator.geolocation){toast('הדפדפן לא תומך במיקום');return}
  navigator.geolocation.getCurrentPosition(p=>{
    const ll=[p.coords.latitude,p.coords.longitude];S.me=ll;
    meMarker?meMarker.setLatLng(ll):meMarker=L.marker(ll,{icon:meIcon,zIndexOffset:1000}).addTo(map);
    updateGo();cb&&cb(ll);
  },()=>toast('אין גישה למיקום – אשר הרשאת מיקום או הקלד כתובת מוצא'),{enableHighAccuracy:true,timeout:10000});
}
$('locate').onclick=()=>locate(ll=>map.flyTo(ll,16,{duration:.8}));
locate();

/* ===== הוראות בעברית ===== */
const MOD={left:'שמאלה',right:'ימינה','slight left':'קלות שמאלה','slight right':'קלות ימינה','sharp left':'חדה שמאלה','sharp right':'חדה ימינה',straight:'ישר',uturn:'פרסה'};
const ARR={left:'↰',right:'↱','slight left':'↖','slight right':'↗','sharp left':'↰','sharp right':'↱',straight:'↑',uturn:'⤺'};
function instr(s){
  const m=s.maneuver,mod=m.modifier,to=s.name?` ל${s.name}`:'',on=s.name?` ב${s.name}`:'';
  switch(m.type){
    case 'depart':return 'צא לדרך'+on;
    case 'arrive':return 'היעד שלך';
    case 'roundabout':case 'rotary':return `בכיכר צא ביציאה ה-${m.exit||1}`+to;
    case 'exit roundabout':case 'exit rotary':return 'צא מהכיכר'+to;
    case 'merge':return 'השתלב'+to;
    case 'on ramp':return 'עלה על המחלף'+to;
    case 'off ramp':return 'רד במחלף'+to;
    case 'fork':return `במזלג המשך ${MOD[mod]||''}`+to;
    case 'end of road':return `בסוף הדרך פנה ${MOD[mod]||''}`+to;
    case 'continue':case 'new name':return (mod==='straight'||!mod?'המשך ישר':`המשך ${MOD[mod]}`)+on;
    default:return mod==='straight'?'המשך ישר'+on:`פנה ${MOD[mod]||''}`+to;
  }
}
const icon=s=>s.maneuver.type==='arrive'?'⚑':s.maneuver.type.includes('round')||s.maneuver.type.includes('rotary')?'⟳':(ARR[s.maneuver.modifier]||'↑');
const fmtDist=m=>m>=1000?(m/1000).toFixed(m>=10000?0:1)+' ק"מ':Math.max(10,Math.round(m/10)*10)+' מ\'';
const sayDist=m=>m>=1000?(m/1000).toFixed(1).replace('.0','')+' קילומטר':Math.round(m/50)*50+' מטר';
const fmtDur=s=>{const m=Math.max(1,Math.round(s/60));return m<60?m+' דק\'':Math.floor(m/60)+' שע\' '+(m%60?m%60+' דק\'':'')};
const clock=s=>new Date(Date.now()+s*1000).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});

/* ===== מגירה נגררת למטה/למעלה ===== */
function drawer(el,peekEl,varName){
  const grab=el.querySelector('.grab');let off=0,max=0,sy=0,so=0,moved=0,lastY=0,lastT=0,v=0,down=false;
  const measure=()=>{const top=el.getBoundingClientRect().top-off;const peek=peekEl.getBoundingClientRect().bottom-off-top+14;max=Math.max(0,el.offsetHeight-peek)};
  const set=(o,anim)=>{off=Math.max(0,Math.min(max,o));el.style.transition=anim?'transform .28s cubic-bezier(.2,.8,.2,1)':'none';el.style.transform=`translateY(${off}px)`;document.documentElement.style.setProperty(varName,(el.offsetHeight-off)+'px')};
  const api={open(){measure();set(0,true)},close(){measure();set(max,true)},isOpen:()=>off<max/2};
  grab.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;down=true;measure();sy=lastY=e.clientY;so=off;moved=0;v=0;lastT=performance.now();grab.setPointerCapture(e.pointerId)});
  grab.addEventListener('pointermove',e=>{if(!down)return;const now=performance.now();v=(e.clientY-lastY)/Math.max(1,now-lastT);lastY=e.clientY;lastT=now;moved=Math.max(moved,Math.abs(e.clientY-sy));set(so+e.clientY-sy,false)});
  const up=()=>{if(!down)return;down=false;
    if(moved<6){api.isOpen()?api.close():api.open();return}
    if(v>.4)api.close();else if(v<-.4)api.open();else off>max/2?api.close():api.open()};
  grab.addEventListener('pointerup',up);grab.addEventListener('pointercancel',up);
  addEventListener("resize",()=>{if(el.offsetHeight)api.close()});
  return api;
}
const sheetD=drawer($('sheet'),$('peekEnd'),'--peek');
const navD=drawer($('navbar'),$('navPeek'),'--navpeek');

/* ===== מסלול ===== */
async function fetchRoute(a,b){
  const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson&steps=true`);
  const j=await r.json();if(j.code!=='Ok'||!j.routes.length)throw 0;return j.routes[0];
}
function buildRoute(rt){
  const c=rt.geometry.coordinates.map(p=>[p[1],p[0]]),cum=[0];
  for(let i=1;i<c.length;i++)cum[i]=cum[i-1]+map.distance(c[i-1],c[i]);
  const steps=rt.legs[0].steps,sAlong=[];let from=0;
  for(const s of steps){
    const l=[s.maneuver.location[1],s.maneuver.location[0]];let best=from,bd=1e12;
    for(let i=from;i<c.length;i++){const d=(c[i][0]-l[0])**2+(c[i][1]-l[1])**2;if(d<bd){bd=d;best=i}}
    sAlong.push(cum[best]);from=best;
  }
  return {c,cum,total:cum[cum.length-1]||1,dur:rt.duration,steps,sAlong,last:-1,spoken:new Set(),off:0};
}
function drawRoute(c){
  routeCasing&&map.removeLayer(routeCasing);routeLine&&map.removeLayer(routeLine);
  routeCasing=L.polyline(c,{color:'#0b5fa8',weight:12,opacity:.9}).addTo(map);
  routeLine=L.polyline(c,{color:'#33ccff',weight:8}).addTo(map);
}
async function preview(){
  const a=S.from||S.me,b=S.to;if(!a||!b)return;
  $('goBtn').disabled=true;$('goBtn').textContent='מחשב מסלול…';
  try{
    const rt=await fetchRoute(a,b);R=buildRoute(rt);drawRoute(R.c);
    $('dur').textContent=fmtDur(rt.duration);$('dist').textContent=fmtDist(rt.distance);$('arr').textContent='הגעה ב-'+clock(rt.duration);
    $('steps').innerHTML=R.steps.map(s=>`<li><span class="ic">${icon(s)}</span><span>${esc(instr(s))}</span><span class="d">${s.distance?fmtDist(s.distance):''}</span></li>`).join('');
    $('sheet').style.display='block';document.body.classList.add('has-route');
    requestAnimationFrame(()=>{sheetD.close();const pk=parseInt(getComputedStyle(document.documentElement).getPropertyValue('--peek'))||220;
      map.fitBounds(routeLine.getBounds(),{paddingTopLeft:[30,230],paddingBottomRight:[30,pk+30]})});
  }catch{toast('לא נמצא מסלול. נסה כתובות אחרות')}
  $('goBtn').disabled=false;$('goBtn').textContent='חשב מסלול';
}
$('goBtn').onclick=preview;
$('f').addEventListener('submit',e=>{e.preventDefault();preview()});
$('swap').onclick=()=>{
  const fv=$('from').value,tv=$('to').value,fp=S.from||S.me,tp=S.to;
  $('from').value=tv;$('to').value=fv||'המיקום שלי';
  setPoint('from',tp,false);setPoint('to',fp,false);if(R)preview();
};
function clearRoute(){
  routeCasing&&map.removeLayer(routeCasing);routeLine&&map.removeLayer(routeLine);routeLine=routeCasing=null;R=null;
  $('sheet').style.display='none';document.body.classList.remove('has-route');
}
$('clear').onclick=()=>{$('to').value='';setPoint('to',null,false);clearRoute()};
$('cancel').onclick=clearRoute;

/* ===== קול ===== */
let muted=false,heVoice=null;
function pickVoice(){const v=speechSynthesis.getVoices();heVoice=v.find(x=>/^he|iw/i.test(x.lang))||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){
  if(muted||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';if(heVoice)u.voice=heVoice;u.rate=1.05;speechSynthesis.speak(u)}catch{}
}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊';if(muted)try{speechSynthesis.cancel()}catch{}};

/* ===== מצב נסיעה ===== */
const N={on:false,sim:false,watch:null,simT:null,simAlong:0,pos:null,head:0,dispPos:null,dispHead:0,anim:null,zoom:17,raf:0,wake:null,rerouting:false,lastReroute:0,lastFix:null};
const rot=$('rot');
function sizeRot(){
  if(!N.on){rot.style.cssText='';map.invalidateSize({pan:false});return}
  const D=Math.ceil(Math.hypot(innerWidth,innerHeight))+20;
  rot.style.width=rot.style.height=D+'px';rot.style.left=(innerWidth-D)/2+'px';rot.style.top=(innerHeight-D)/2+'px';
  map.invalidateSize({pan:false});
}
addEventListener('resize',sizeRot);
function bearing(a,b){const y=Math.sin((b[1]-a[1])*RAD)*Math.cos(b[0]*RAD),x=Math.cos(a[0]*RAD)*Math.sin(b[0]*RAD)-Math.sin(a[0]*RAD)*Math.cos(b[0]*RAD)*Math.cos((b[1]-a[1])*RAD);return (Math.atan2(y,x)/RAD+360)%360}
const angDiff=(a,b)=>(((b-a)%360)+540)%360-180;

async function startNav(sim){
  if(!R)return;
  N.on=true;N.sim=sim;N.zoomOff=0;recenter();document.body.classList.add('nav');$('simTag').hidden=!sim;
  map.dragging.disable();map.touchZoom.disable();map.doubleClickZoom.disable();map.scrollWheelZoom.disable();map.boxZoom.disable();
  meMarker&&meMarker.setOpacity(0);fromMarker&&map.removeLayer(fromMarker);fromMarker=null;
  sizeRot();R.lastK=-1;requestAnimationFrame(()=>navD.close());
  const p0=R.c[0];N.head=R.c.length>1?bearing(R.c[0],R.c[Math.min(3,R.c.length-1)]):0;
  N.pos=N.dispPos=p0;N.dispHead=N.head;
  carMarker=L.marker(p0,{icon:carIcon,zIndexOffset:2000,interactive:false}).addTo(map);
  say('יוצאים לדרך. '+instr(R.steps[1]||R.steps[0]));
  try{N.wake=await navigator.wakeLock.request('screen');N.wake.addEventListener('release',()=>N.wake=null)}catch{}
  N.lastFix=null;onFix(p0[0],p0[1],N.head,0,true);
  if(sim){N.simAlong=0;N.simT=setInterval(simTick,1000)}
  else if(navigator.geolocation){
    N.watch=navigator.geolocation.watchPosition(p=>onFix(p.coords.latitude,p.coords.longitude,p.coords.heading,p.coords.speed),
      ()=>toast('אין גישה למיקום. אשר הרשאת מיקום בדפדפן'),{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  }
  cancelAnimationFrame(N.raf);N.raf=requestAnimationFrame(frame);
}
function stopNav(msg){
  N.on=false;recenter();ptrs.clear();document.body.classList.remove('nav');
  if(N.watch!=null)navigator.geolocation.clearWatch(N.watch);N.watch=null;
  clearInterval(N.simT);cancelAnimationFrame(N.raf);
  try{N.wake&&N.wake.release()}catch{}N.wake=null;
  carMarker&&map.removeLayer(carMarker);carMarker=null;
  rot.style.transform='';meMarker&&meMarker.setOpacity(1);
  map.dragging.enable();map.touchZoom.enable();map.doubleClickZoom.enable();map.scrollWheelZoom.enable();map.boxZoom.enable();
  sizeRot();
  if(msg){toast(msg,4000);clearRoute()}
  else if(routeLine){sheetD.close();map.fitBounds(routeLine.getBounds(),{paddingTopLeft:[30,230],paddingBottomRight:[30,250]})}
}
$('startNav').onclick=()=>startNav(false);
$('simNav').onclick=()=>startNav(true);
$('stopNav').onclick=()=>stopNav();

/* הדמיית נסיעה לאורך המסלול */
function simTick(){
  if(!R)return;
  const v=Math.min(28,10+N.simAlong/40);
  N.simAlong=Math.min(R.total,N.simAlong+v);
  const a=N.simAlong,c=R.c,cum=R.cum;let i=0;
  while(i<c.length-2&&cum[i+1]<a)i++;
  const seg=cum[i+1]-cum[i]||1,t=Math.min(1,(a-cum[i])/seg);
  onFix(c[i][0]+(c[i+1][0]-c[i][0])*t,c[i][1]+(c[i+1][1]-c[i][1])*t,bearing(c[i],c[i+1]),v);
}

/* הנקודה הקרובה ביותר על המסלול */
function nearest(lat,lon,full){
  const c=R.c,kx=111320*Math.cos(lat*RAD),ky=110540;
  const lo=full||R.last<0?0:Math.max(0,R.last-15),hi=full||R.last<0?c.length-2:Math.min(c.length-2,R.last+400);
  let best={i:0,t:0,d:1e12};
  for(let i=lo;i<=hi;i++){
    const ax=(c[i][1]-lon)*kx,ay=(c[i][0]-lat)*ky,bx=(c[i+1][1]-lon)*kx,by=(c[i+1][0]-lat)*ky;
    const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;let t=L2?-(ax*dx+ay*dy)/L2:0;t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(ax+t*dx,ay+t*dy);if(d<best.d)best={i,t,d};
  }
  if(c.length<2)best={i:0,t:0,d:map.distance([lat,lon],c[0])};
  best.along=R.cum[best.i]+best.t*((R.cum[best.i+1]||R.cum[best.i])-R.cum[best.i]);
  return best;
}

function onFix(lat,lon,heading,speed,first){
  if(!N.on||!R)return;
  const p=[lat,lon];
  // כיוון נסיעה
  if(first){}
  else if(heading!=null&&!isNaN(heading)&&(speed==null||speed>1.5))N.head=heading;
  else if(N.lastFix&&map.distance(N.lastFix,p)>6)N.head=bearing(N.lastFix,p);
  N.lastFix=p;
  // מהירות
  $('spd').textContent=speed!=null&&!isNaN(speed)?Math.round(speed*3.6):'–';
  const kmh=(speed||0)*3.6;N.zoom=kmh>90?15:kmh>50?16:17;
  // אנימציה חלקה למיקום החדש
  N.anim={from:N.dispPos||p,to:p,h0:N.dispHead,h1:N.dispHead+angDiff(N.dispHead,N.head),t0:performance.now(),dur:first?1:950};
  if(N.rerouting)return;
  // מיקום על המסלול
  let n=nearest(lat,lon);if(n.d>40)n=nearest(lat,lon,true);
  if(n.d>50){
    if(++R.off>=3&&Date.now()-N.lastReroute>8000)return reroute(p);
  }else{R.off=0;R.last=n.i}
  const along=n.along,rem=Math.max(0,R.total-along);
  // הגעה
  if(rem<25||(R.last>=R.c.length-2&&n.t>.95)){say('הגעת ליעד');return stopNav('הגעת ליעד! 🎉')}
  // הפנייה הבאה
  let k=R.steps.length-1;
  for(let j=1;j<R.steps.length;j++)if(R.sAlong[j]>along+5){k=j;break}
  const st=R.steps[k],dTo=Math.max(0,R.sAlong[k]-along),txt=instr(st);
  if(k!==R.lastK){R.lastK=k;
    $('navSteps').innerHTML=R.steps.slice(k).map(s=>`<li><span class="ic">${icon(s)}</span><span>${esc(instr(s))}</span><span class="d">${s.distance?fmtDist(s.distance):''}</span></li>`).join('');}
  $('bArrow').textContent=icon(st);$('bDist').textContent=fmtDist(dTo);$('bText').textContent=txt;
  // הכרזות קוליות
  const kmhNow=Math.max(kmh,30),farAt=kmhNow>80?1000:450;
  if(dTo<=farAt&&dTo>160&&!R.spoken.has(k+'f')){R.spoken.add(k+'f');say('בעוד '+sayDist(dTo)+', '+txt)}
  else if(dTo<=70&&!R.spoken.has(k+'n')){R.spoken.add(k+'n');R.spoken.add(k+'f');say(st.maneuver.type==='arrive'?'היעד לפניך':txt)}
  // זמן ומרחק שנותרו
  const remS=R.dur*rem/R.total;
  $('nEta').textContent=clock(remS);$('nRem').textContent=fmtDur(remS)+' · '+fmtDist(rem);
  // לקצץ את החלק שכבר נסענו
  const left=[p].concat(R.c.slice(n.i+1));routeLine.setLatLngs(left);routeCasing.setLatLngs(left);
}

async function reroute(p){
  N.rerouting=true;N.lastReroute=Date.now();$('reroute').style.display='block';say('מחשב מסלול מחדש');
  try{
    const rt=await fetchRoute(p,S.to);R=buildRoute(rt);drawRoute(R.c);N.simAlong=0;
  }catch{toast('לא הצלחתי לחשב מסלול חדש')}
  if(R)R.off=0;
  N.rerouting=false;$('reroute').style.display='none';
}

/* ציור כל פריים: הרכב זז והמפה מסתובבת לכיוון הנסיעה */
function frame(now){
  if(!N.on)return;
  const a=N.anim;
  if(a){
    const t=Math.min(1,(now-a.t0)/a.dur);
    N.dispPos=[a.from[0]+(a.to[0]-a.from[0])*t,a.from[1]+(a.to[1]-a.from[1])*t];
    N.dispHead=a.h0+(a.h1-a.h0)*t;
    const h=N.dispHead;
    carMarker.setLatLng(N.dispPos);
    const el=carMarker.getElement();if(el){const s=el.querySelector('svg');if(s)s.style.transform=`rotate(${h}deg)`}
    if(!N.free){
      const z=Math.max(10,Math.min(19,N.zoom+(N.zoomOff||0))),pt=map.project(N.dispPos,z),off=innerHeight*.22;
      const c=map.unproject(pt.add(L.point(Math.sin(h*RAD)*off,-Math.cos(h*RAD)*off)),z);
      map.setView(c,z,{animate:false});
      rot.style.transform=`rotate(${-h}deg)`;
    }
  }
  N.raf=requestAnimationFrame(frame);
}
/* ===== זום בזמן נהיגה ===== */
function zoomBy(d){
  if(N.free){map.setZoom(Math.max(10,Math.min(19,map.getZoom()+d)),{animate:false});enterFree();}
  else N.zoomOff=Math.max(-6,Math.min(3,(N.zoomOff||0)+d));
}
$('zin').onclick=()=>zoomBy(1);$('zout').onclick=()=>zoomBy(-1);
// מונע מהדפדפן להגדיל את כל הדף או לגלול אותו בזמן נסיעה
rot.addEventListener('touchmove',e=>{if(N.on)e.preventDefault()},{passive:false});
rot.addEventListener('touchstart',e=>{if(N.on&&e.touches.length>1)e.preventDefault()},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>{if(N.on)e.preventDefault()},{passive:false}));

/* ===== הזזת המפה בזמן נהיגה ===== */
const ptrs=new Map();let pinch=null,freeT=null;
function enterFree(){
  if(!N.free){N.free=true;N.freeHead=N.dispHead;document.body.classList.add('free')}
  clearTimeout(freeT);freeT=setTimeout(recenter,15000);
}
function recenter(){clearTimeout(freeT);N.free=false;document.body.classList.remove('free')}
$('recenter').onclick=recenter;
const gap=()=>{const [a,b]=[...ptrs.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1};
rot.addEventListener('pointerdown',e=>{
  if(!N.on)return;enterFree();ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{rot.setPointerCapture(e.pointerId)}catch{}
  if(ptrs.size===2)pinch={d:gap(),z:map.getZoom()};
});
rot.addEventListener('pointermove',e=>{
  if(!N.on||!ptrs.has(e.pointerId))return;
  const p=ptrs.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  enterFree();
  if(ptrs.size===1){
    const t=N.freeHead*RAD,mx=dx*Math.cos(t)-dy*Math.sin(t),my=dx*Math.sin(t)+dy*Math.cos(t);
    map.panBy([-mx,-my],{animate:false});
  }else if(pinch&&ptrs.size===2){
    const z=Math.max(9,Math.min(19,pinch.z+Math.log2(gap()/pinch.d)));
    map.setZoom(Math.round(z*4)/4,{animate:false});
  }
});
const lift=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null};
rot.addEventListener('pointerup',lift);rot.addEventListener('pointercancel',lift);
rot.addEventListener('wheel',e=>{if(!N.on)return;e.preventDefault();enterFree();map.setZoom(Math.max(9,Math.min(19,map.getZoom()-Math.sign(e.deltaY)*.5)),{animate:false})},{passive:false});

document.addEventListener('visibilitychange',async()=>{if(N.on&&document.visibilityState==='visible'&&!N.wake)try{N.wake=await navigator.wakeLock.request('screen')}catch{}});
}
</script>
</body>
</html>
