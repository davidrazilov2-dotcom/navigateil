<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="נוסעים">
<meta name="theme-color" content="#33ccff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>נוסעים – ניווט חי בישראל</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#33ccff;--blue-d:#0aa5dd;--ink:#1d2733;--mut:#6b7784;--line:#e4e9ee;--nav:#16222f;--card:#fff;--field:#f2f5f8;--hover:#eef7fc}
body.night{--ink:#e8eef4;--mut:#93a3b3;--line:#2d3b48;--card:#1c2733;--field:#26343f;--hover:#2a3a48}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;font:16px/1.45 Rubik,system-ui,sans-serif;color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#map{position:fixed;inset:0;background:#eef0ec}
body.night #map{background:#1b232b}
.maplibregl-ctrl-attrib{display:none}
.attr{position:fixed;bottom:2px;left:6px;z-index:400;font-size:11px;color:#556;background:rgba(255,255,255,.7);padding:0 5px;border-radius:4px}
.attr a{color:inherit}
body.nav .attr{display:none}
.card{background:var(--card);border-radius:18px;box-shadow:0 6px 24px rgba(20,40,60,.18);color:var(--ink)}
/* ---- חיפוש ---- */
.top{position:fixed;top:max(12px,env(safe-area-inset-top));inset-inline:12px;z-index:500;max-width:460px;margin-inline-start:auto}
.search{padding:10px 12px 6px;display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;position:relative}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.a{background:#fff;border:3px solid var(--blue-d)}.dot.b{background:#ff4f6d}
.row input{flex:1;font:inherit;font-size:16px;border:0;background:var(--field);border-radius:12px;padding:11px 12px;outline:none;color:var(--ink)}
.row input::placeholder{color:var(--mut)}
.row input:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.ibtn{width:44px;height:44px;border:0;border-radius:12px;background:var(--field);cursor:pointer;display:grid;place-items:center;flex:none;color:var(--ink)}
.ibtn svg{width:20px;height:20px}
.sugg{position:absolute;top:100%;inset-inline:22px 0;z-index:10;margin-top:4px;padding:4px;display:none;max-height:55vh;overflow:auto}
.sugg button{display:flex;gap:10px;align-items:center;width:100%;text-align:start;border:0;background:none;padding:10px;border-radius:10px;font:inherit;cursor:pointer;color:var(--ink)}
.sugg button:hover{background:var(--hover)}
.sugg .t{flex:1;font-weight:500}
.sugg small{display:block;color:var(--mut);font-size:13px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sugg small.warn{color:#d9822b;white-space:normal}
.sugg .km{color:var(--mut);font-size:13px;white-space:nowrap}
.sugg .h{font-size:12px;color:var(--mut);padding:6px 10px 2px}
.sugg .pi{width:30px;height:30px;border-radius:50%;background:var(--field);display:grid;place-items:center;flex:none;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 13px;border-radius:19px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px Rubik,sans-serif;cursor:pointer;white-space:nowrap}
.chip:active,.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.go{margin:0 12px 12px}
.cta{width:100%;height:50px;border:0;border-radius:25px;background:var(--blue);color:#fff;font:700 18px Rubik,sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--blue-d)}
.cta:active{transform:translateY(2px);box-shadow:none}
.cta:disabled{opacity:.45;box-shadow:none}
/* ---- מגירת מסלול ---- */
.sheet{position:fixed;bottom:0;inset-inline:0;z-index:500;max-width:460px;margin-inline-start:auto;display:none;will-change:transform}
.sheet .card{padding:0 16px max(14px,env(safe-area-inset-bottom));max-height:78vh;display:flex;flex-direction:column;border-radius:22px 22px 0 0}
.grab{touch-action:none;cursor:grab;padding-top:8px;user-select:none;-webkit-user-select:none}
.handle{display:block;width:44px;height:5px;border-radius:3px;background:#cfd6dd;margin:0 auto 10px}
.eta{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.eta b{font-size:32px;line-height:1.05;color:var(--blue-d)}
.eta span{color:var(--mut)}
.alts{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.alt{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:7px 12px;text-align:start;font:14px Rubik,sans-serif;cursor:pointer}
.alt b{display:block;font-size:16px}
.alt.sel{border-color:var(--blue);box-shadow:inset 0 0 0 2px var(--blue)}
.tag{font-size:11px;background:#e5f7ff;color:#0a7fb0;border-radius:6px;padding:1px 6px;margin-inline-start:4px}
.btns{display:flex;gap:8px;margin-top:12px}
.btns button{height:48px;border-radius:24px;border:1px solid var(--line);background:var(--card);font:500 16px Rubik,sans-serif;cursor:pointer;color:var(--ink);padding:0 14px}
.btns .start{flex:1;background:var(--blue);border:0;color:#fff;font-weight:700;font-size:18px;box-shadow:0 3px 0 var(--blue-d)}
.saveRow{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--mut);font-size:14px;flex-wrap:wrap}
.saveRow button{height:36px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px Rubik,sans-serif;padding:0 12px;cursor:pointer}
.steps{list-style:none;margin:12px 0 0;padding:0;overflow:auto;border-top:1px solid var(--line)}
.steps li{display:flex;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:center}
.ic{width:34px;height:34px;border-radius:50%;background:rgba(51,204,255,.15);display:grid;place-items:center;flex:none;font-size:20px;color:var(--blue-d);font-weight:700}
.steps .d{margin-inline-start:auto;color:var(--mut);font-size:14px;white-space:nowrap}
/* ---- מצב נסיעה ---- */
.nav-only{display:none}#simTag[hidden]{display:none!important}
body.nav .nav-only{display:block}
body.nav .top,body.nav .sheet,body.nav #locate,body.nav #compass{display:none!important}
#banner{position:fixed;top:0;inset-inline:0;z-index:600;background:var(--nav);color:#fff;padding:max(12px,env(safe-area-inset-top)) 16px 14px;box-shadow:0 4px 18px rgba(0,0,0,.3)}
#banner .in{display:flex;align-items:center;gap:14px;max-width:640px;margin:0 auto}
#bArrow{width:64px;height:64px;border-radius:16px;background:var(--blue);display:grid;place-items:center;font-size:42px;font-weight:800;flex:none;line-height:1}
#bDist{font-size:34px;font-weight:800;line-height:1.05;white-space:nowrap}
#bText{font-size:18px;opacity:.92;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#navbar{position:fixed;bottom:0;inset-inline:0;z-index:600;background:var(--card);color:var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.18);padding:0 16px max(14px,env(safe-area-inset-bottom));max-height:70vh;display:none;flex-direction:column;will-change:transform}
body.nav #navbar{display:flex}
#navbar .grab{padding-bottom:10px}
#navbar .in{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
#navSteps{max-width:640px;width:100%;margin:0 auto}
#nEta{font-size:28px;font-weight:800;line-height:1}
#nRem{color:var(--mut);font-size:15px;margin-top:4px;white-space:nowrap}
.stop{margin-inline-start:auto;height:50px;padding:0 20px;border:0;border-radius:25px;background:#ff4f6d;color:#fff;font:700 17px Rubik,sans-serif;cursor:pointer;flex:none}
.round{width:48px;height:48px;border-radius:50%;border:0;background:var(--field);color:var(--ink);cursor:pointer;display:grid;place-items:center;flex:none;font-size:21px}
#speed{position:fixed;z-index:600;left:14px;bottom:calc(var(--navpeek,110px) + 14px);width:74px;height:74px;border-radius:50%;background:#fff;color:#1d2733;box-shadow:0 4px 16px rgba(0,0,0,.25);text-align:center;padding-top:12px;border:4px solid transparent}
#speed b{display:block;font-size:28px;font-weight:800;line-height:1}
#speed small{font-size:12px;color:#6b7784}
#speed.over{background:#ff4f6d;color:#fff;border-color:#fff;animation:pulse 1s infinite}
#speed.over small{color:#fff}
@keyframes pulse{50%{transform:scale(1.08)}}
#simTag{position:fixed;z-index:600;right:14px;bottom:calc(var(--navpeek,110px) + 14px);background:#ffcc00;color:#222;font-weight:700;font-size:13px;padding:6px 12px;border-radius:14px}
#zoomBtns{position:fixed;z-index:620;right:12px;top:50%;transform:translateY(-50%);display:none;flex-direction:column;gap:10px}
body.nav #zoomBtns{display:flex}
#zoomBtns button{width:56px;height:56px;border-radius:50%;border:0;background:var(--card);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.28);font:700 30px/1 Rubik,sans-serif;cursor:pointer;touch-action:manipulation}
#recenter{position:fixed;z-index:620;left:50%;transform:translateX(-50%);bottom:calc(var(--navpeek,110px) + 16px);height:48px;padding:0 22px;border:0;border-radius:24px;background:var(--nav);color:#fff;font:700 16px Rubik,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;display:none;white-space:nowrap}
body.nav.free #recenter{display:block}
#reroute{position:fixed;z-index:650;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--nav);color:#fff;padding:14px 22px;border-radius:16px;font-weight:700;display:none}
.fab{position:fixed;z-index:500;inset-inline-start:12px;bottom:max(18px,env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;border:0;background:var(--card);box-shadow:0 4px 16px rgba(20,40,60,.25);cursor:pointer;display:grid;place-items:center;color:var(--blue-d)}
.fab svg{width:24px;height:24px}
#compass{bottom:calc(max(18px,env(safe-area-inset-bottom)) + 64px);display:none}
#compass.show{display:grid}
#compass svg{width:30px;height:30px}
body.has-route #locate{bottom:calc(var(--peek,200px) + 14px)}
body.has-route #compass{bottom:calc(var(--peek,200px) + 78px)}
.toast{position:fixed;z-index:900;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--nav);color:#fff;padding:12px 18px;border-radius:14px;display:none;max-width:86vw;text-align:center}
/* ---- הגדרות ---- */
#setBg{position:fixed;inset:0;z-index:800;background:rgba(10,20,30,.45);display:none;align-items:flex-end;justify-content:center}
#setBg.open{display:flex}
#settings{width:100%;max-width:460px;padding:18px 18px max(18px,env(safe-area-inset-bottom));border-radius:22px 22px 0 0;max-height:90vh;overflow:auto}
#settings h2{margin:0 0 6px;font-size:22px}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set label{font-weight:500}
.set small{display:block;color:var(--mut);font-weight:400;font-size:13px}
.set select{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:10px;padding:8px 10px}
.sw{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:15px;background:#c9d2da;position:relative;cursor:pointer;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw:checked{background:var(--blue)}.sw:checked::after{right:25px}
.setFoot{display:flex;gap:8px;margin-top:14px}
.setFoot button{flex:1;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 15px Rubik,sans-serif;cursor:pointer}
.setFoot .ok{background:var(--blue);color:#fff;border:0;font-weight:700}
/* ---- מסך פתיחה ---- */
#splash{position:fixed;inset:0;z-index:2000;background:linear-gradient(160deg,#33ccff,#0a8fd0);display:grid;place-items:center;color:#fff;transition:opacity .45s}
#splash.out{opacity:0;pointer-events:none}
#splash .in{text-align:center}
#splash svg{width:120px;height:120px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.25))}
#splash h1{margin:14px 0 2px;font-size:40px;font-weight:800}
#splash p{margin:0;opacity:.9}
/* ---- סמנים ---- */
.me{width:22px;height:22px;border-radius:50%;background:var(--blue-d);border:4px solid #fff;box-shadow:0 0 0 8px rgba(51,204,255,.25),0 2px 6px rgba(0,0,0,.3)}
.pinm{width:32px;height:42px;display:block;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35));cursor:pointer}
.poi{width:32px;height:32px;border-radius:50%;background:#fff;border:2px solid var(--blue-d);display:grid;place-items:center;font-size:16px;box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer}
.car{width:58px;height:58px;display:block;filter:drop-shadow(0 4px 5px rgba(0,0,0,.4))}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media(max-width:600px){.top,.sheet{max-width:none}#bDist{font-size:30px}#bArrow{width:58px;height:58px;font-size:38px}.stop{padding:0 16px}}
@media(prefers-reduced-motion:reduce){#speed.over{animation:none}}
</style>
</head>
<body>
<div id="splash"><div class="in">
  <svg viewBox="0 0 120 120"><rect width="120" height="120" rx="30" fill="#fff"/><circle cx="60" cy="60" r="40" fill="#33ccff"/><path d="M60 30 80 84 60 72 40 84Z" fill="#fff" stroke="#0a7fb0" stroke-width="3" stroke-linejoin="round"/></svg>
  <h1>נוסעים</h1><p>ניווט חי בישראל</p>
</div></div>

<div id="map"></div>
<div class="attr">© <a href="https://openfreemap.org">OpenFreeMap</a> © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a></div>

<div class="top">
  <div class="card">
    <form class="search" id="f" autocomplete="off">
      <div class="row">
        <i class="dot a"></i>
        <input id="from" placeholder="מאיפה? (המיקום שלי)" aria-label="נקודת מוצא">
        <button type="button" class="ibtn" id="swap" aria-label="החלף מוצא ויעד"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
        <div class="sugg card" id="s-from"></div>
      </div>
      <div class="row">
        <i class="dot b"></i>
        <input id="to" placeholder="לאן נוסעים? למשל: עמשא 16 אופקים" aria-label="יעד">
        <button type="button" class="ibtn" id="clear" aria-label="נקה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <div class="sugg card" id="s-to"></div>
      </div>
    </form>
    <div class="chips" id="chips">
      <button class="chip" data-place="home">🏠 בית</button>
      <button class="chip" data-place="work">💼 עבודה</button>
      <button class="chip" data-cat="fuel">⛽ דלק</button>
      <button class="chip" data-cat="parking">🅿️ חניה</button>
      <button class="chip" data-cat="cafe">☕ קפה</button>
      <button class="chip" data-cat="fast_food">🍔 אוכל</button>
      <button class="chip" data-cat="atm">🏧 כספומט</button>
      <button class="chip" id="openSet">⚙️ הגדרות</button>
    </div>
    <div class="go"><button class="cta" id="goBtn" disabled>חשב מסלול</button></div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="card">
    <div class="grab"><i class="handle"></i><div class="eta"><b id="dur"></b><span id="dist"></span><span id="arr"></span></div></div>
    <div class="alts" id="alts"></div>
    <div class="btns" id="peekEnd">
      <button class="start" id="startNav">יוצאים לדרך!</button>
      <button id="simNav">הדמיה</button>
      <button id="cancel">ביטול</button>
    </div>
    <div class="saveRow">שמור את היעד כ:<button data-save="home">🏠 בית</button><button data-save="work">💼 עבודה</button></div>
    <ul class="steps" id="steps"></ul>
  </div>
</div>

<div id="banner" class="nav-only"><div class="in">
  <div id="bArrow">↑</div>
  <div><div id="bDist"></div><div id="bText"></div></div>
</div></div>
<div id="navbar"><div class="grab"><i class="handle"></i><div class="in" id="navPeek">
  <div><div id="nEta"></div><div id="nRem"></div></div>
  <button class="round" id="share" aria-label="שתף זמן הגעה">📤</button>
  <button class="round" id="mute" aria-label="השתק קול">🔊</button>
  <button class="stop" id="stopNav">עצור</button>
</div></div>
<ul class="steps" id="navSteps"></ul></div>
<div id="speed" class="nav-only"><b id="spd">0</b><small>קמ"ש</small></div>
<div id="simTag" class="nav-only" hidden>מצב הדמיה</div>
<div id="zoomBtns"><button id="zin" aria-label="הגדל">+</button><button id="zout" aria-label="הקטן">−</button></div>
<button id="recenter">➤ חזרה לנסיעה</button>
<div id="reroute">מחשב מסלול מחדש…</div>

<button class="fab" id="compass" aria-label="צפון למעלה"><svg viewBox="0 0 30 30"><path d="M15 3 20 15H10Z" fill="#ff4f6d"/><path d="M15 27 10 15H20Z" fill="#9aa7b4"/><circle cx="15" cy="15" r="2" fill="#fff"/></svg></button>
<button class="fab" id="locate" aria-label="המיקום שלי"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
<div class="toast" id="toast"></div>

<div id="setBg"><div class="card" id="settings" role="dialog" aria-label="הגדרות">
  <h2>הגדרות</h2>
  <div class="set"><label for="sStyle">עיצוב המפה<small>בשעות היום</small></label>
    <select id="sStyle"><option value="liberty">צבעוני תלת-ממד</option><option value="bright">בהיר</option><option value="positron">נקי ומינימלי</option></select></div>
  <div class="set"><label for="sNight">מצב לילה<small>"אוטומטי" = מ-18:00 עד 06:00</small></label>
    <select id="sNight"><option value="auto">אוטומטי</option><option value="on">תמיד</option><option value="off">כבוי</option></select></div>
  <div class="set"><label for="sSpeed">התראת מהירות<small>צפצוף והודעה קולית מעל המהירות</small></label>
    <select id="sSpeed"><option value="0">כבוי</option><option>50</option><option>60</option><option>70</option><option>80</option><option>90</option><option>100</option><option>110</option><option>120</option></select></div>
  <div class="set"><label for="s3d">תצוגת תלת-ממד בנסיעה<small>מבט מוטה עם בניינים</small></label><input type="checkbox" class="sw" id="s3d"></div>
  <div class="set"><label for="sTolls">הימנעות מכבישי אגרה<small>למשל כביש 6 ומנהרות הכרמל</small></label><input type="checkbox" class="sw" id="sTolls"></div>
  <div class="set"><label for="sVoice">הוראות קוליות</label><input type="checkbox" class="sw" id="sVoice"></div>
  <div class="setFoot"><button id="clearSaved">מחק יעדים שמורים</button><button class="ok" id="closeSet">סגור</button></div>
</div></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RAD=Math.PI/180;
const load=(k,d)=>{try{return Object.assign(d,JSON.parse(localStorage.getItem(k)||'{}'))}catch{return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const ST=load('nv-set',{night:'auto',speed:0,tolls:false,voice:true,style:'liberty',d3:true});
const SV=load('nv-saved',{home:null,work:null,recent:[]});

function hav(a,b){const dLa=(b[0]-a[0])*RAD,dLo=(b[1]-a[1])*RAD,s=Math.sin(dLa/2)**2+Math.cos(a[0]*RAD)*Math.cos(b[0]*RAD)*Math.sin(dLo/2)**2;return 12742000*Math.asin(Math.sqrt(s))}

let routeGJ=null,altsGJ={type:'FeatureCollection',features:[]};

function firstSymbol(){const l=(map.getStyle().layers||[]).find(x=>x.type==='symbol');return l&&l.id}
function onStyle(){
  // תוויות בעברית, ועיצוב אישי
  for(const l of map.getStyle().layers||[]){
    if(l.type==='symbol'&&l.layout&&l.layout['text-field']&&JSON.stringify(l.layout['text-field']).includes('name')){
      try{map.setLayoutProperty(l.id,'text-field',['coalesce',['get','name:he'],['get','name'],['get','name:latin']])}catch{}
    }
    if(l.id==='water'&&curStyle!=='dark')try{map.setPaintProperty(l.id,'fill-color','#9fd3f0')}catch{}
  }
  const before=firstSymbol();
  if(!map.getSource('alts'))map.addSource('alts',{type:'geojson',data:altsGJ});
  if(!map.getSource('route'))map.addSource('route',{type:'geojson',data:routeGJ||EMPTY});
  const ln={'line-join':'round','line-cap':'round'};
  if(!map.getLayer('alt-casing'))map.addLayer({id:'alt-casing',type:'line',source:'alts',layout:ln,paint:{'line-color':'#6f8598','line-width':['interpolate',['linear'],['zoom'],8,6,16,14]}},before);
  if(!map.getLayer('alt-line'))map.addLayer({id:'alt-line',type:'line',source:'alts',layout:ln,paint:{'line-color':'#c8d6e3','line-width':['interpolate',['linear'],['zoom'],8,3.5,16,9]}},before);
  if(!map.getLayer('route-casing'))map.addLayer({id:'route-casing',type:'line',source:'route',layout:ln,paint:{'line-color':'#0b5fa8','line-width':['interpolate',['linear'],['zoom'],8,7,16,16]}},before);
  if(!map.getLayer('route-line'))map.addLayer({id:'route-line',type:'line',source:'route',layout:ln,paint:{'line-color':'#33ccff','line-width':['interpolate',['linear'],['zoom'],8,4,16,10]}},before);
}
map.on('style.load',onStyle);
function setRouteData(coords){routeGJ=coords?{type:'Feature',properties:{},geometry:{type:'LineString',coordinates:coords.map(LL)}}:null;const s=map.getSource('route');s&&s.setData(routeGJ||EMPTY)}
function setAltsData(list){altsGJ={type:'FeatureCollection',features:list.map(o=>({type:'Feature',properties:{i:o.i},geometry:{type:'LineString',coordinates:o.c.map(LL)}}))};const s=map.getSource('alts');s&&s.setData(altsGJ)}

function toast(t,ms=2600){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)}
function marker(el,ll,opt){return new maplibregl.Marker(Object.assign({element:el},opt||{})).setLngLat(LL(ll)).addTo(map)}
function divEl(cls,html){const d=document.createElement('div');if(cls)d.className=cls;if(html)d.innerHTML=html;return d}
const pinEl=c=>divEl('',`<svg class="pinm" viewBox="0 0 32 42"><path d="M16 41C16 41 2.5 24.5 2.5 15a13.5 13.5 0 0 1 27 0C29.5 24.5 16 41 16 41Z" fill="${c}" stroke="#fff" stroke-width="2.5"/><circle cx="16" cy="15" r="5.5" fill="#fff"/></svg>`);
function flyTo(ll,z){map.flyTo({center:LL(ll),zoom:Math.max(map.getZoom(),z||14),duration:900})}
function fitLL(pts,pad){
  if(!pts.length)return;let a=[90,180],b=[-90,-180];
  pts.forEach(p=>{a=[Math.min(a[0],p[0]),Math.min(a[1],p[1])];b=[Math.max(b[0],p[0]),Math.max(b[1],p[1])]});
  map.fitBounds([[a[1],a[0]],[b[1],b[0]]],{padding:Object.assign({top:60,bottom:60,left:40,right:40},pad||{}),maxZoom:16,duration:700,bearing:map.getBearing()});
}

/* ===== חיפוש כתובות ===== */
const NOM='https://nominatim.openstreetmap.org/';
const IL_BOX='34.2,29.4,35.95,33.4';
const uniq=a=>a.filter((x,i)=>x&&a.indexOf(x)===i);
function fromNom(p,num){
  const a=p.address||{},city=a.city||a.town||a.village||a.municipality||a.hamlet||'',state=a.state||'';
  let title,kind='place';
  if(a.house_number&&a.road){title=a.road+' '+a.house_number;kind='house'}
  else if(p.addresstype==='road'||p.category==='highway'){title=a.road||p.name;kind='street'}
  else if(['city','town','village','hamlet','suburb','neighbourhood','quarter'].includes(p.addresstype)){title=p.name||city;kind='city'}
  else title=p.name||a.road||String(p.display_name||'').split(',')[0];
  const sub=uniq([kind==='city'?'':city,state].filter(x=>x!==title)).join(', ');
  return {title,sub,ll:[+p.lat,+p.lon],kind,approx:!!num&&kind==='street'};
}
function fromPhoton(f,num){
  const p=f.properties||{},c=f.geometry.coordinates;
  let title,kind='place';
  if(p.housenumber&&(p.street||p.name)){title=(p.street||p.name)+' '+p.housenumber;kind='house'}
  else if(p.osm_key==='highway'||p.type==='street'){title=p.name;kind='street'}
  else if(['city','town','village','district','locality'].includes(p.type)||p.osm_key==='place'){title=p.name;kind='city'}
  else title=p.name||p.street;
  const city=p.city||(kind==='city'?'':p.locality||p.county||'');
  const sub=uniq([kind==='city'?'':city,p.state||''].filter(x=>x!==title)).join(', ');
  return {title,sub,ll:[c[1],c[0]],kind,approx:!!num&&kind==='street'};
}
async function geocode(q){
  const m=q.match(/^(.*?[^\d\s,])\s+(\d+[א-ת]?)(?:\s*,?\s*(.+))?$/),num=m?m[2]:null;
  const near=S.me?`&lat=${S.me[0]}&lon=${S.me[1]}`:'';
  const nom=u=>fetch(u).then(r=>r.json()).then(j=>(Array.isArray(j)?j:[]).map(p=>fromNom(p,num))).catch(()=>[]);
  const jobs=[
    fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=8&bbox=${IL_BOX}${near}`).then(r=>r.json()).then(j=>(j.features||[]).map(f=>fromPhoton(f,num))).catch(()=>[]),
    nom(`${NOM}search?format=jsonv2&addressdetails=1&limit=8&countrycodes=il&accept-language=he&q=${encodeURIComponent(q)}`)
  ];
  if(m){ // חיפוש מובנה: רחוב + מספר בית (+ עיר אם נכתבה)
    const city=m[3]?`&city=${encodeURIComponent(m[3])}`:'';
    jobs.push(nom(`${NOM}search?format=jsonv2&addressdetails=1&limit=8&countrycodes=il&accept-language=he&street=${encodeURIComponent(m[2]+' '+m[1])}${city}`));
  }
  const all=(await Promise.all(jobs)).flat().filter(r=>r.title);
  const out=[];
  for(const r of all){if(!out.some(o=>o.title===r.title&&o.sub.split(',')[0]===r.sub.split(',')[0]&&hav(o.ll,r.ll)<400))out.push(r)}
  const rank=r=>(r.kind==='house'?0:r.kind==='street'?1:r.kind==='city'?2:3);
  out.sort((a,b)=>rank(a)-rank(b));
  if(num)out.forEach(r=>{if(r.approx)r.note=`מספר ${num} לא מסומן במפה – ננווט לרחוב`});
  return out.slice(0,10);
}
async function reverse(lat,lon){
  const fb='נקודה במפה';
  try{const j=await (await fetch(`${NOM}reverse?format=jsonv2&accept-language=he&addressdetails=1&zoom=18&lat=${lat}&lon=${lon}`)).json();
    if(!j||j.error)return fb;const x=fromNom(j);return x.title?(x.title+(x.sub?', '+x.sub.split(',')[0]:'')):fb}catch{return fb}
}
const KIND_IC={house:'🏠',street:'🛣️',city:'🏙️',place:'📍'};
function showList(box,html,items,onPick){
  box.innerHTML=html;box.style.display='block';
  box.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{box.style.display='none';onPick(items[+b.dataset.i])});
}
const label=r=>r.title+(r.sub?', '+r.sub.split(',')[0]:'');
function setupSearch(key){
  const inp=$(key),box=$('s-'+key);let t,seq=0;
  inp.addEventListener('input',()=>{
    S[key]=null;updateGo();clearTimeout(t);
    const q=inp.value.trim();if(q.length<2){q?box.style.display='none':showSaved(key);return}
    t=setTimeout(async()=>{
      const my=++seq;box.innerHTML='<div class="h">מחפש…</div>';box.style.display='block';
      const res=await geocode(q);if(my!==seq)return;

      showList(box,res.map((r,i)=>`<button type="button" data-i="${i}"><span class="pi">${KIND_IC[r.kind]}</span><span class="t">${esc(r.title)}<small>${esc(r.sub)}</small>${r.note?`<small class="warn">${esc(r.note)}</small>`:''}</span></button>`).join(''),res,
        r=>{const n=label(r);inp.value=n;setPoint(key,r.ll,true,n)});
    },450);
  });
  inp.addEventListener('focus',()=>{if(!inp.value.trim())showSaved(key)});
  inp.addEventListener('blur',()=>setTimeout(()=>box.style.display='none',200));
}
function showSaved(key){
  const box=$('s-'+key),items=[];let html='';
  if(SV.home){items.push(SV.home);html+=`<button type="button" data-i="${items.length-1}"><span class="pi">🏠</span><span class="t">בית<small>${esc(SV.home.name)}</small></span></button>`}
  if(SV.work){items.push(SV.work);html+=`<button type="button" data-i="${items.length-1}"><span class="pi">💼</span><span class="t">עבודה<small>${esc(SV.work.name)}</small></span></button>`}
  if(SV.recent.length){html+='<div class="h">אחרונים</div>';SV.recent.forEach(r=>{items.push(r);html+=`<button type="button" data-i="${items.length-1}"><span class="pi">🕘</span><span class="t">${esc(r.name)}</span></button>`})}
  if(!items.length){box.style.display='none';return}
  showList(box,html,items,p=>{$(key).value=p.name;setPoint(key,p.ll,true,p.name);if(key==='to')preview()});
}

function setPoint(key,ll,fly=true,name){

  else{toMarker&&toMarker.remove();toMarker=ll&&marker(pinEl('#ff4f6d'),ll,{anchor:'bottom'})}

}

map.on('click',async e=>{

function locate(cb){
  if(!navigator.geolocation){toast('הדפדפן לא תומך במיקום');return}
  navigator.geolocation.getCurrentPosition(p=>{
    const ll=[p.coords.latitude,p.coords.longitude];S.me=ll;
    meMarker?meMarker.setLngLat(LL(ll)):meMarker=marker(divEl('me'),ll);
    updateGo();cb&&cb(ll);
  },()=>toast('אין גישה למיקום – אשר הרשאת מיקום או הקלד כתובת מוצא'),{enableHighAccuracy:true,timeout:10000});
}

const CAT_IC={fuel:'⛽',parking:'🅿️',cafe:'☕',fast_food:'🍔',atm:'🏧'};
function clearPois(){poiMarkers.forEach(m=>m.remove());poiMarkers=[];document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'))}
async function catSearch(cat,chip){
  clearPois();chip.classList.add('on');
  const mc=map.getCenter(),c=S.me||[mc.lat,mc.lng],d=.06;
  const vb=`${c[1]-d},${c[0]+d},${c[1]+d},${c[0]-d}`;
  let res=[];
  try{
    res=await (await fetch(`${NOM}search?format=jsonv2&limit=15&accept-language=he&addressdetails=1&countrycodes=il&bounded=1&viewbox=${vb}&amenity=${cat}`)).json();
    if(!Array.isArray(res)||!res.length)res=await (await fetch(`${NOM}search?format=jsonv2&limit=15&accept-language=he&addressdetails=1&bounded=1&viewbox=${vb}&q=${encodeURIComponent(CAT_HE[cat])}`)).json();
  }catch{toast('שגיאה בחיפוש, נסה שוב');chip.classList.remove('on');return}
  if(!Array.isArray(res)||!res.length){toast('לא נמצא שום דבר קרוב');chip.classList.remove('on');return}
  const items=res.map(p=>{const r=fromNom(p);r._d=hav(c,r.ll);return r}).sort((a,b)=>a._d-b._d);

}

/* ===== הוראות בעברית ===== */
const MOD={left:'שמאלה',right:'ימינה','slight left':'קלות שמאלה','slight right':'קלות ימינה','sharp left':'חדה שמאלה','sharp right':'חדה ימינה',straight:'ישר',uturn:'פרסה'};
const ARR={left:'↰',right:'↱','slight left':'↖','slight right':'↗','sharp left':'↰','sharp right':'↱',straight:'↑',uturn:'⤺'};
function instr(s){
  const m=s.maneuver,mod=m.modifier,to=s.name?` ל${s.name}`:'',on=s.name?` ב${s.name}`:'';
  switch(m.type){
    case 'depart':return 'צא לדרך'+on;
    case 'arrive':return 'היעד שלך';
    case 'roundabout':case 'rotary':return `בכיכר צא ביציאה ה-${m.exit||1}`+to;
    case 'exit roundabout':case 'exit rotary':return 'צא מהכיכר'+to;
    case 'merge':return 'השתלב'+to;
    case 'on ramp':return 'עלה על המחלף'+to;
    case 'off ramp':return 'רד במחלף'+to;
    case 'fork':return `במזלג המשך ${MOD[mod]||''}`+to;
    case 'end of road':return `בסוף הדרך פנה ${MOD[mod]||''}`+to;
    case 'continue':case 'new name':return (mod==='straight'||!mod?'המשך ישר':`המשך ${MOD[mod]}`)+on;
    default:return mod==='straight'?'המשך ישר'+on:`פנה ${MOD[mod]||''}`+to;
  }
}
const icon=s=>s.maneuver.type==='arrive'?'⚑':s.maneuver.type.includes('round')||s.maneuver.type.includes('rotary')?'⟳':(ARR[s.maneuver.modifier]||'↑');
const fmtDist=m=>m>=1000?(m/1000).toFixed(m>=10000?0:1)+' ק"מ':Math.max(10,Math.round(m/10)*10)+' מ\'';
const sayDist=m=>m>=1000?(m/1000).toFixed(1).replace('.0','')+' קילומטר':Math.round(m/50)*50+' מטר';
const fmtDur=s=>{const m=Math.max(1,Math.round(s/60));return m<60?m+' דק\'':Math.floor(m/60)+' שע\' '+(m%60?m%60+' דק\'':'')};
const clock=s=>new Date(Date.now()+s*1000).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});

/* ===== מגירה נגררת ===== */
function drawer(el,peekEl,varName){
  const grab=el.querySelector('.grab');let off=0,max=0,sy=0,so=0,moved=0,lastY=0,lastT=0,v=0,down=false;
  const measure=()=>{const top=el.getBoundingClientRect().top-off;const peek=peekEl.getBoundingClientRect().bottom-off-top+14;max=Math.max(0,el.offsetHeight-peek)};
  const set=(o,anim)=>{off=Math.max(0,Math.min(max,o));el.style.transition=anim?'transform .28s cubic-bezier(.2,.8,.2,1)':'none';el.style.transform=`translateY(${off}px)`;document.documentElement.style.setProperty(varName,(el.offsetHeight-off)+'px')};
  const api={open(){measure();set(0,true)},close(){measure();set(max,true)},isOpen:()=>off<max/2};
  grab.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;down=true;measure();sy=lastY=e.clientY;so=off;moved=0;v=0;lastT=performance.now();try{grab.setPointerCapture(e.pointerId)}catch{}});
  grab.addEventListener('pointermove',e=>{if(!down)return;const now=performance.now();v=(e.clientY-lastY)/Math.max(1,now-lastT);lastY=e.clientY;lastT=now;moved=Math.max(moved,Math.abs(e.clientY-sy));set(so+e.clientY-sy,false)});
  const up=()=>{if(!down)return;down=false;
    if(moved<6){api.isOpen()?api.close():api.open();return}
    if(v>.4)api.close();else if(v<-.4)api.open();else off>max/2?api.close():api.open()};
  grab.addEventListener('pointerup',up);grab.addEventListener('pointercancel',up);
  addEventListener('resize',()=>{if(el.offsetHeight)api.close()});
  return api;
}

async function fetchRoutes(a,b,alts){
  const base=`https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson&steps=true&alternatives=${alts?'3':'false'}`;
  let j;
  if(ST.tolls){
    try{j=await (await fetch(base+'&exclude=toll')).json()}catch{}
    if(!j||j.code!=='Ok'){j=null;toast('לא הצלחתי להימנע מכבישי אגרה במסלול הזה')}
  }
  if(!j)j=await (await fetch(base)).json();
  if(j.code!=='Ok'||!j.routes.length)throw 0;return j.routes;
}
function buildRoute(rt){
  const c=rt.geometry.coordinates.map(p=>[p[1],p[0]]),cum=[0];
  for(let i=1;i<c.length;i++)cum[i]=cum[i-1]+hav(c[i-1],c[i]);
  const steps=rt.legs[0].steps,sAlong=[];let from=0;
  for(const s of steps){
    const l=[s.maneuver.location[1],s.maneuver.location[0]];let best=from,bd=1e12;
    for(let i=from;i<c.length;i++){const d=(c[i][0]-l[0])**2+(c[i][1]-l[1])**2;if(d<bd){bd=d;best=i}}
    sAlong.push(cum[best]);from=best;
  }
  return {c,cum,total:cum[cum.length-1]||1,dur:rt.duration,dist:rt.distance,steps,sAlong,last:-1,spoken:new Set(),off:0};
}
function drawRoutes(onlySel){
  setAltsData(onlySel?[]:routes.map((r,i)=>({i,c:r.c})).filter(o=>o.i!==sel));
  setRouteData(R?R.c:null);
}
function selectRoute(i){if(!routes[i])return;sel=i;R=routes[i];drawRoutes();renderSheet()}
function renderSheet(){
  $('dur').textContent=fmtDur(R.dur);$('dist').textContent=fmtDist(R.dist);$('arr').textContent='הגעה ב-'+clock(R.dur);
  const fast=routes.reduce((b,r,i)=>r.dur<routes[b].dur?i:b,0),short=routes.reduce((b,r,i)=>r.dist<routes[b].dist?i:b,0);
  $('alts').innerHTML=routes.length<2?'':routes.map((r,i)=>`<button class="alt${i===sel?' sel':''}" data-i="${i}"><b>${fmtDur(r.dur)}${i===fast?'<span class="tag">המהיר</span>':''}${i===short&&short!==fast?'<span class="tag">הקצר</span>':''}</b>${fmtDist(r.dist)}</button>`).join('');
  $('alts').querySelectorAll('.alt').forEach(b=>b.onclick=()=>selectRoute(+b.dataset.i));
  $('steps').innerHTML=R.steps.map(s=>`<li><span class="ic">${icon(s)}</span><span>${esc(instr(s))}</span><span class="d">${s.distance?fmtDist(s.distance):''}</span></li>`).join('');
}
function fitRoutes(){
  const pts=routes.flatMap(r=>r.c.filter((_,i)=>i%15===0).concat([r.c[r.c.length-1]]));
  fitLL(pts,{top:280,bottom:(cssNum('--peek')||240)+30});
}
async function preview(){
  const a=S.from||S.me,b=S.to;if(!a||!b){if(b&&!a)toast('הקלד נקודת מוצא או אשר גישה למיקום');return}
  $('goBtn').disabled=true;$('goBtn').textContent='מחשב מסלול…';clearPois();
  try{
    const rts=await fetchRoutes(a,b,true);routes=rts.map(buildRoute);sel=0;R=routes[0];
    drawRoutes();renderSheet();addRecent();
    $('sheet').style.display='block';document.body.classList.add('has-route');
    requestAnimationFrame(()=>{sheetD.close();fitRoutes()});
  }catch{toast('לא נמצא מסלול. נסה כתובות אחרות')}
  $('goBtn').disabled=false;$('goBtn').textContent='חשב מסלול';
}
$('goBtn').onclick=preview;
$('f').addEventListener('submit',e=>{e.preventDefault();preview()});
$('swap').onclick=()=>{
  const fv=$('from').value,tv=$('to').value,fp=S.from||S.me,tp=S.to;
  $('from').value=tv;$('to').value=fv||'המיקום שלי';
  setPoint('from',tp,false);setPoint('to',fp,false,fv||'המיקום שלי');if(R)preview();
};
function clearRoute(){
  R=null;routes=[];drawRoutes();
  $('sheet').style.display='none';document.body.classList.remove('has-route');
}
$('clear').onclick=()=>{$('to').value='';setPoint('to',null,false);clearRoute();clearPois()};
$('cancel').onclick=clearRoute;

/* ===== הגדרות ===== */
function fillSet(){$('sNight').value=ST.night;$('sSpeed').value=String(ST.speed);$('sTolls').checked=ST.tolls;$('sVoice').checked=ST.voice;$('sStyle').value=ST.style;$('s3d').checked=ST.d3}
$('openSet').onclick=()=>{fillSet();$('setBg').classList.add('open')};
$('closeSet').onclick=()=>$('setBg').classList.remove('open');
$('setBg').onclick=e=>{if(e.target.id==='setBg')$('setBg').classList.remove('open')};
$('sStyle').onchange=e=>{ST.style=e.target.value;store('nv-set',ST);applyNight()};
$('sNight').onchange=e=>{ST.night=e.target.value;store('nv-set',ST);applyNight()};
$('sSpeed').onchange=e=>{ST.speed=+e.target.value;store('nv-set',ST)};
$('s3d').onchange=e=>{ST.d3=e.target.checked;store('nv-set',ST)};
$('sTolls').onchange=e=>{ST.tolls=e.target.checked;store('nv-set',ST);if(R&&!N.on)preview()};
$('sVoice').onchange=e=>{ST.voice=e.target.checked;store('nv-set',ST);syncMute()};
$('clearSaved').onclick=()=>{SV.home=SV.work=null;SV.recent=[];store('nv-saved',SV);toast('היעדים השמורים נמחקו')};

/* ===== קול ===== */
let heVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();heVoice=v.find(x=>/^(he|iw)/i.test(x.lang))||null}catch{}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t){
  if(!ST.voice||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='he-IL';if(heVoice)u.voice=heVoice;u.rate=1.05;speechSynthesis.speak(u)}catch{}
}
let actx;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.25)}catch{}}
function syncMute(){$('mute').textContent=ST.voice?'🔊':'🔇'}
syncMute();
$('mute').onclick=()=>{ST.voice=!ST.voice;store('nv-set',ST);syncMute();if(!ST.voice)try{speechSynthesis.cancel()}catch{}};

/* ===== מצב נסיעה ===== */
const N={on:false,sim:false,watch:null,simT:null,simAlong:0,head:0,dispPos:null,dispHead:0,anim:null,zoom:17,zoomOff:0,raf:0,wake:null,rerouting:false,lastReroute:0,lastFix:null,free:false,lastWarn:0,remS:0};
function bearing(a,b){const y=Math.sin((b[1]-a[1])*RAD)*Math.cos(b[0]*RAD),x=Math.cos(a[0]*RAD)*Math.sin(b[0]*RAD)-Math.sin(a[0]*RAD)*Math.cos(b[0]*RAD)*Math.cos((b[1]-a[1])*RAD);return (Math.atan2(y,x)/RAD+360)%360}
const angDiff=(a,b)=>(((b-a)%360)+540)%360-180;
async function wakeOn(){try{N.wake=await navigator.wakeLock.request('screen');N.wake.addEventListener('release',()=>N.wake=null)}catch{}}

function startNav(sim){
  if(!R)return;
  N.on=true;N.sim=sim;N.zoomOff=0;recenter();document.body.classList.add('nav');$('simTag').hidden=!sim;
  if(meMarker)meMarker.getElement().style.display='none';fromMarker&&fromMarker.remove();fromMarker=null;
  routes=[R];sel=0;drawRoutes(true);
  R.lastK=-1;requestAnimationFrame(()=>navD.close());
  const p0=R.c[0];N.head=R.c.length>1?bearing(R.c[0],R.c[Math.min(3,R.c.length-1)]):0;
  N.dispPos=p0;N.dispHead=N.head;
  carMarker=marker(divEl('','<svg class="car" viewBox="0 0 58 58"><circle cx="29" cy="29" r="26" fill="#fff"/><circle cx="29" cy="29" r="22" fill="#33ccff"/><path d="M29 11 43 42 29 34 15 42Z" fill="#fff" stroke="#0a7fb0" stroke-width="2" stroke-linejoin="round"/></svg>'),p0,{rotationAlignment:'map',pitchAlignment:'map'});
  say('יוצאים לדרך. '+instr(R.steps[1]||R.steps[0]));
  wakeOn();
  N.lastFix=null;onFix(p0[0],p0[1],N.head,0,true);
  if(sim){N.simAlong=0;N.simT=setInterval(simTick,1000)}
  else if(navigator.geolocation){
    N.watch=navigator.geolocation.watchPosition(p=>onFix(p.coords.latitude,p.coords.longitude,p.coords.heading,p.coords.speed),
      ()=>toast('אין גישה למיקום. אשר הרשאת מיקום בדפדפן'),{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  }
  cancelAnimationFrame(N.raf);N.raf=requestAnimationFrame(frame);
}
function stopNav(msg){
  N.on=false;recenter();document.body.classList.remove('nav');
  if(N.watch!=null)navigator.geolocation.clearWatch(N.watch);N.watch=null;
  clearInterval(N.simT);cancelAnimationFrame(N.raf);
  try{N.wake&&N.wake.release()}catch{}N.wake=null;
  carMarker&&carMarker.remove();carMarker=null;$('speed').classList.remove('over');
  if(meMarker)meMarker.getElement().style.display='';
  map.easeTo({pitch:0,bearing:0,padding:{top:0,bottom:0,left:0,right:0},duration:400});
  if(msg){toast(msg,4000);clearRoute()}
  else if(R){renderSheet();sheetD.close();setTimeout(fitRoutes,450)}
}
$('startNav').onclick=()=>startNav(false);
$('simNav').onclick=()=>startNav(true);
$('stopNav').onclick=()=>stopNav();

$('share').onclick=async()=>{
  const p=N.dispPos||S.me,eta=clock(N.remS||0);
  const text=`אני בדרך${S.toName?' ל'+S.toName:''}, אגיע בערך ב-${eta}.`+(p?` המיקום שלי: https://maps.google.com/?q=${p[0].toFixed(5)},${p[1].toFixed(5)}`:'');
  if(navigator.share){try{await navigator.share({text});return}catch(e){if(e&&e.name==='AbortError')return}}
  location.href='https://wa.me/?text='+encodeURIComponent(text);
};

function simTick(){
  if(!R||N.rerouting)return;
  const v=Math.min(28,10+N.simAlong/40);
  N.simAlong=Math.min(R.total,N.simAlong+v);
  const a=N.simAlong,c=R.c,cum=R.cum;let i=0;
  while(i<c.length-2&&cum[i+1]<a)i++;
  const seg=cum[i+1]-cum[i]||1,t=Math.min(1,(a-cum[i])/seg);
  onFix(c[i][0]+(c[i+1][0]-c[i][0])*t,c[i][1]+(c[i+1][1]-c[i][1])*t,bearing(c[i],c[i+1]),v);
}

function nearest(lat,lon,full){
  const c=R.c,kx=111320*Math.cos(lat*RAD),ky=110540;
  const lo=full||R.last<0?0:Math.max(0,R.last-15),hi=full||R.last<0?c.length-2:Math.min(c.length-2,R.last+400);
  let best={i:0,t:0,d:1e12};
  for(let i=lo;i<=hi;i++){
    const ax=(c[i][1]-lon)*kx,ay=(c[i][0]-lat)*ky,bx=(c[i+1][1]-lon)*kx,by=(c[i+1][0]-lat)*ky;
    const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;let t=L2?-(ax*dx+ay*dy)/L2:0;t=Math.max(0,Math.min(1,t));
    const d=Math.hypot(ax+t*dx,ay+t*dy);if(d<best.d)best={i,t,d};
  }
  if(c.length<2)best={i:0,t:0,d:hav([lat,lon],c[0])};
  best.along=R.cum[best.i]+best.t*((R.cum[best.i+1]||R.cum[best.i])-R.cum[best.i]);
  return best;
}

function onFix(lat,lon,heading,speed,first){
  if(!N.on||!R)return;
  const p=[lat,lon];
  if(first){}
  else if(heading!=null&&!isNaN(heading)&&(speed==null||speed>1.5))N.head=heading;
  else if(N.lastFix&&hav(N.lastFix,p)>6)N.head=bearing(N.lastFix,p);
  N.lastFix=p;
  const kmh=speed!=null&&!isNaN(speed)?speed*3.6:0;
  $('spd').textContent=speed!=null&&!isNaN(speed)?Math.round(kmh):'–';
  N.zoom=kmh>90?15.5:kmh>50?16.3:17;
  const over=ST.speed&&kmh>ST.speed+3;
  $('speed').classList.toggle('over',!!over);
  if(over&&Date.now()-N.lastWarn>20000){N.lastWarn=Date.now();beep();setTimeout(()=>say('שים לב, אתה מעל '+ST.speed),300)}
  N.anim={from:N.dispPos||p,to:p,h0:N.dispHead,h1:N.dispHead+angDiff(N.dispHead,N.head),t0:performance.now(),dur:first?1:950};
  if(N.rerouting)return;
  let n=nearest(lat,lon);if(n.d>40)n=nearest(lat,lon,true);
  if(n.d>50){
    if(++R.off>=3&&Date.now()-N.lastReroute>8000)return reroute(p);
  }else{R.off=0;R.last=n.i}
  const along=n.along,rem=Math.max(0,R.total-along);
  if(rem<25||(R.last>=R.c.length-2&&n.t>.95)){say('הגעת ליעד');return stopNav('הגעת ליעד! 🎉')}
  let k=R.steps.length-1;
  for(let j=1;j<R.steps.length;j++)if(R.sAlong[j]>along+5){k=j;break}
  if(k!==R.lastK){R.lastK=k;
    $('navSteps').innerHTML=R.steps.slice(k).map(s=>`<li><span class="ic">${icon(s)}</span><span>${esc(instr(s))}</span><span class="d">${s.distance?fmtDist(s.distance):''}</span></li>`).join('')}
  const st=R.steps[k],dTo=Math.max(0,R.sAlong[k]-along),txt=instr(st);
  $('bArrow').textContent=icon(st);$('bDist').textContent=fmtDist(dTo);$('bText').textContent=txt;
  const farAt=Math.max(kmh,30)>80?1000:450;
  if(dTo<=farAt&&dTo>160&&!R.spoken.has(k+'f')){R.spoken.add(k+'f');say('בעוד '+sayDist(dTo)+', '+txt)}
  else if(dTo<=70&&!R.spoken.has(k+'n')){R.spoken.add(k+'n');R.spoken.add(k+'f');say(st.maneuver.type==='arrive'?'היעד לפניך':txt)}
  N.remS=R.dur*rem/R.total;
  $('nEta').textContent=clock(N.remS);$('nRem').textContent=fmtDur(N.remS)+' · '+fmtDist(rem);
  setRouteData([p].concat(R.c.slice(n.i+1)));
}

async function reroute(p){
  N.rerouting=true;N.lastReroute=Date.now();$('reroute').style.display='block';say('מחשב מסלול מחדש');
  try{const rts=await fetchRoutes(p,S.to,false);R=buildRoute(rts[0]);R.lastK=-1;routes=[R];sel=0;drawRoutes(true);N.simAlong=0}
  catch{toast('לא הצלחתי לחשב מסלול חדש')}
  if(R)R.off=0;
  N.rerouting=false;$('reroute').style.display='none';
}

/* כל פריים: הרכב זז, והמצלמה עוקבת ומסתובבת לכיוון הנסיעה */
function frame(now){
  if(!N.on)return;
  const a=N.anim;
  if(a){
    const t=Math.min(1,(now-a.t0)/a.dur);
    N.dispPos=[a.from[0]+(a.to[0]-a.from[0])*t,a.from[1]+(a.to[1]-a.from[1])*t];
    N.dispHead=a.h0+(a.h1-a.h0)*t;
    carMarker.setLngLat(LL(N.dispPos)).setRotation(N.dispHead);
    if(!N.free){
      map.jumpTo({center:LL(N.dispPos),bearing:N.dispHead,zoom:Math.max(10,Math.min(19,N.zoom+N.zoomOff)),pitch:ST.d3?55:0,
        padding:{top:Math.round(innerHeight*(ST.d3?.42:.35)),bottom:0,left:0,right:0}});
    }
  }
  N.raf=requestAnimationFrame(frame);
}

/* ===== זום, הזזה וסיבוב בזמן נסיעה ===== */
let freeT=null;
function enterFree(){
  if(!N.on)return;
  if(!N.free){N.free=true;document.body.classList.add('free')}
  clearTimeout(freeT);freeT=setTimeout(recenter,15000);
}
function recenter(){clearTimeout(freeT);N.free=false;document.body.classList.remove('free')}
$('recenter').onclick=recenter;
['dragstart','rotatestart','pitchstart','zoomstart','drag','rotate'].forEach(ev=>map.on(ev,e=>{if(N.on&&e&&e.originalEvent)enterFree()}));
function zoomBy(d){
  if(N.free){map.zoomTo(Math.max(10,Math.min(19,map.getZoom()+d)),{duration:250});enterFree()}
  else N.zoomOff=Math.max(-6,Math.min(3,N.zoomOff+d));
}
$('zin').onclick=()=>zoomBy(1);$('zout').onclick=()=>zoomBy(-1);
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});

document.addEventListener('visibilitychange',()=>{if(N.on&&document.visibilityState==='visible'&&!N.wake)wakeOn()});
setTimeout(()=>{$('splash').classList.add('out');setTimeout(()=>$('splash').remove(),600)},900);
}
</script>
